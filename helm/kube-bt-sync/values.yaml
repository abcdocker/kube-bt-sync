replicaCount: 1

image:
  repository: ghcr.io/your-org/kube-bt-sync
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 8080
  nodePort: 32080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: kube-bt-sync.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

env:
  KUBEBT_DATA_DIR: "/data"

extraEnv: []
#  - name: BAOTA_URL
#    value: "http://..."
#  - name: DDNS_HOST
#    value: "home.example.com"

# 敏感信息建议用 extraEnvFrom
extraEnvFrom: []
#  - secretRef:
#      name: kube-bt-sync-secrets

nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  # true = 与 deploy/rbac.yaml 一致（控制台 + YAML 下发）；false = 仅 Ingress 同步（需自行改模板）
  full: true
