{{- if and (gt (int .Values.app.replicaCount) 1) .Values.persistence.enabled (eq .Values.persistence.accessMode "ReadWriteOnce") }}
{{- fail "app.replicaCount > 1 时不能共用 ReadWriteOnce PVC；请改用 ReadWriteMany、关闭本地持久化并使用 MySQL/Redis，或保持单副本" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.app.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.app.image.pullSecret }}
      {{- end }}
      containers:
        - name: kube-bt-sync
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: KUBEBT_DATA_DIR
              value: "/data"
            {{- if .Values.app.performance.goMaxProcs }}
            - name: KUBEBT_GOMAXPROCS
              value: {{ .Values.app.performance.goMaxProcs | quote }}
            {{- end }}
            - name: KUBEBT_ENABLE_BACKGROUND_JOBS
              value: {{ .Values.app.performance.enableBackgroundJobs | quote }}
            {{- if .Values.app.performance.performanceMode }}
            - name: KUBEBT_PERFORMANCE_MODE
              value: "true"
            {{- end }}
            # 宝塔与 DDNS
            {{- if .Values.config.baotaUrl }}
            - name: BAOTA_URL
              value: {{ .Values.config.baotaUrl | quote }}
            {{- end }}
            {{- if .Values.config.ddnsHost }}
            - name: DDNS_HOST
              value: {{ .Values.config.ddnsHost | quote }}
            {{- end }}
            {{- if .Values.config.defaultPort }}
            - name: DEFAULT_PORT
              value: {{ .Values.config.defaultPort | quote }}
            {{- end }}
            {{- if .Values.config.httpsPort }}
            - name: HTTPS_PORT
              value: {{ .Values.config.httpsPort | quote }}
            {{- end }}
            # 认证
            {{- if .Values.config.authUser }}
            - name: DASHBOARD_USER
              value: {{ .Values.config.authUser | quote }}
            {{- end }}
          {{- if .Values.app.existingSecret }}
          # Secret 中使用环境变量名作为 key，例如 BAOTA_API_KEY、DASHBOARD_PASSWORD、VCENTER_PASSWORD。
          envFrom:
            - secretRef:
                name: {{ .Values.app.existingSecret | quote }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" .Release.Name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
