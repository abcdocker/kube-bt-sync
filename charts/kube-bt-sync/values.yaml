app:
  replicaCount: 1
  performance:
    # 与 resources.limits.cpu 整核一致，如 "2"；留空则不设置
    goMaxProcs: ""
    enableBackgroundJobs: true
    performanceMode: false
  image:
    repository: harbor.frps.cn/kube-bt-sync
    tag: v2.0.0
    pullPolicy: IfNotPresent
    # 私有仓库拉取密钥（可选）
    pullSecret: ""
  service:
    type: NodePort
    port: 8080
    nodePort: 31080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# 持久化存储
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  # 若使用已有 PVC，填写名称并禁用自动创建
  existingClaim: ""
  # 集群 StorageClass，空则使用默认
  storageClass: ""

# 安全与环境配置
config:
  # 宝塔面板配置（可选，也可通过 Web /setup 配置）
  baotaUrl: ""
  baotaApiKey: ""
  # 家庭宽带 DDNS 配置
  ddnsHost: "home.example.com"
  defaultPort: "38333"
  httpsPort: "38443"
  # Web 登录（可选）
  authUser: ""
  authPassword: ""

# ==========================================
# 📦 底层依赖开关 (一键安装前置组件)
# ==========================================
ingress-nginx:
  enabled: false
  controller:
    hostNetwork: true
    kind: DaemonSet
    image:
      registry: registry.aliyuncs.com
      image: google_containers/nginx-ingress-controller
    admissionWebhooks:
      patch:
        image:
          registry: registry.aliyuncs.com
          image: google_containers/kube-webhook-certgen

metallb:
  enabled: false
  controller:
    image:
      registry: quay.m.daocloud.io
  speaker:
    image:
      registry: quay.m.daocloud.io
