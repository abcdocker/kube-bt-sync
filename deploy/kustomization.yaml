apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-bt-sync

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  # Secret 请自行创建（见 secret-example.yaml），勿将真实密钥提交仓库
  - deployment.yaml
  - service.yaml

# 按需取消注释：
#  - service-nodeport.yaml
#  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/component: kube-bt-sync
    includeSelectors: false

# 单文件通用模板（含 NodePort 32080）：kubectl apply -f deploy/kube-bt-sync-all.yaml
# 模块化：kubectl apply -k deploy/
