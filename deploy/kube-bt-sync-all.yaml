# 通用模板（namespace kube-bt-sync）：
#   kubectl apply -f deploy/kube-bt-sync-all.yaml
# GitHub Release 附带的同名清单会自动使用当前仓库实际发布的 GHCR 镜像，推荐优先使用。
#
# 若私有仓库需登录拉取镜像，先创建 pull secret 再编辑 Deployment 增加 imagePullSecrets：
#   kubectl create secret docker-registry my-registry-secret \
#     --docker-server=your-registry.example.com --docker-username=你的用户 --docker-password=你的密码 \
#     -n kube-bt-sync
#   kubectl -n kube-bt-sync patch deploy kube-bt-sync --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"my-registry-secret"}]}]'
#
# 访问：浏览器打开 http://<任意节点IP>:32080/setup 完成向导（需集群内可连的 MySQL / Redis）。
# 若 PVC 一直处于 Pending，在下方 PVC 中取消注释并填写集群的 storageClassName。
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bt-sync
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bt-sync
subjects:
  - kind: ServiceAccount
    name: kube-bt-sync
    namespace: kube-bt-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-bt-sync-data
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # 集群无默认 StorageClass 时取消下一行注释并填写，例如：local-path、nfs-client、rook-ceph-block
  # storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-bt-sync
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-bt-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bt-sync
    spec:
      serviceAccountName: kube-bt-sync
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 私有 Registry 拉取镜像时取消注释（需先创建同名 secret，见文件头说明）
      # imagePullSecrets:
      #   - name: my-registry-secret
      containers:
        - name: kube-bt-sync
          image: ghcr.io/kube-bt-sync/kube-bt-sync:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBEBT_DATA_DIR
              value: "/data"
          # Optional: create kube-bt-sync-secrets before or after applying this manifest.
          envFrom:
            - secretRef:
                name: kube-bt-sync-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: kube-bt-sync-data
---
apiVersion: v1
kind: Service
metadata:
  name: kube-bt-sync
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-bt-sync
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kube-bt-sync-nodeport
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-bt-sync
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32080
      protocol: TCP
