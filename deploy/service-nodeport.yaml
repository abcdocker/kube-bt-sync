# 可选：无 Ingress / LoadBalancer 时暴露控制台（NodePort）
apiVersion: v1
kind: Service
metadata:
  name: kube-bt-sync-nodeport
  namespace: kube-bt-sync
  labels:
    app.kubernetes.io/name: kube-bt-sync
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-bt-sync
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32080
      protocol: TCP
