---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bt-sync-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bt-sync-role
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bt-sync-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bt-sync-role
subjects:
- kind: ServiceAccount
  name: kube-bt-sync-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-bt-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-bt-sync
  template:
    metadata:
      labels:
        app: kube-bt-sync
    spec:
      serviceAccountName: kube-bt-sync-sa
      containers:
      - name: sync-server
        image: your-repo/kube-bt-sync:latest # 改成你的 Dockerhub 镜像名
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: BAOTA_URL
          value: "http://公网IP:面板端口"
        - name: BAOTA_API_KEY
          value: "宝塔面板API_KEY"
        - name: DDNS_HOST
          value: "home.i4t.com"
        - name: DEFAULT_PORT
          value: "38333"
---
apiVersion: v1
kind: Service
metadata:
  name: kube-bt-sync-svc
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32080
  selector:
    app: kube-bt-sync