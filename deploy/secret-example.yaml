# 示例：将敏感环境变量放入 Secret，再由 Deployment 引用。
# 部署前请替换占位符，并建议删除本文件中的注释再 apply（或改用 kubectl create secret）。
#
# cp deploy/secret-example.yaml /tmp/kube-bt-sync-secret.yaml
# 替换占位符后 apply /tmp 中的副本，不要把真实密钥写回仓库。
apiVersion: v1
kind: Secret
metadata:
  name: kube-bt-sync-secrets
  namespace: kube-bt-sync
type: Opaque
stringData:
  DASHBOARD_PASSWORD: "replace-with-a-strong-password"
  DASHBOARD_SESSION_SECRET: "replace-with-at-least-32-random-bytes"
  KUBEBT_ENCRYPTION_KEY: "replace-with-at-least-32-random-bytes"
  PLATFORM_PUBLIC_URL: "https://kube-bt-sync.example.com"
  MYSQL_HOST: "mysql.example.internal"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "kube_bt_sync"
  MYSQL_USER: "kube_bt_sync"
  MYSQL_PASSWORD: "replace-with-the-database-password"
  REDIS_ADDR: "redis.example.internal:6379"
  REDIS_PASSWORD: "replace-with-the-redis-password"
  # Optional Baota integration:
  # BAOTA_URL: "https://baota.example.com:8888"
  # BAOTA_API_KEY: "replace-with-the-baota-api-key"
