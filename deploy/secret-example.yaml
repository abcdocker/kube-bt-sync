# 示例：将敏感环境变量放入 Secret，再由 Deployment 引用。
# 部署前请替换占位符，并建议删除本文件中的注释再 apply（或改用 kubectl create secret）。
#
# kubectl apply -f secret-example.yaml
# 然后在 deployment.yaml 中增加 envFrom 或逐个 valueFrom secretKeyRef。
apiVersion: v1
kind: Secret
metadata:
  name: kube-bt-sync-secrets
  namespace: kube-bt-sync
type: Opaque
stringData:
  # Web 登录（与 DASHBOARD_USER 对应）
  dashboard-password: "请替换为强密码"
  # 宝塔 API
  baota-api-key: "请替换"