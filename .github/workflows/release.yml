name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'

env:
  # ------------------------------------------------------------------------------
  # 代理配置（仅在 self-hosted runner 或本地环境中有效）
  # GitHub 官方 runner 无法访问 127.0.0.1:7890，如需使用请配置 self-hosted runner
  # ------------------------------------------------------------------------------
  https_proxy: http://127.0.0.1:7890
  http_proxy: http://127.0.0.1:7890
  all_proxy: http://127.0.0.1:7890
  # Harbor 配置
  HARBOR_REGISTRY: harbor.frps.cn
  IMAGE_NAME: kube-bt-sync-main/v1

jobs:
  # ------------------------------------------------------------------------------
  # Job 1: 编译多平台二进制并创建 GitHub Release
  # ------------------------------------------------------------------------------
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json

      - name: Build frontend
        working-directory: react
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build multi-platform binaries
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then continue; fi
              output="kube-bt-sync-${os}-${arch}"
              if [ "$os" = "windows" ]; then output="${output}.exe"; fi
              echo "Building $os/$arch -> $output"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags="-s -w -X kube-bt-sync/internal.BuildVersion=${VERSION}" \
                -o dist/$output .
            done
          done
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: dist/*
          generate_release_notes: true

  # ------------------------------------------------------------------------------
  # Job 2: 构建多平台 Docker 镜像并推送到 Harbor
  # ------------------------------------------------------------------------------
  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
